#     command: npx
#     args: ["-y", "@acme/tickets-mcp"]
#     env: { TICKETS_TOKEN: "${TICKETS_TOKEN}" }
#     read_only: [search_tickets, get_ticket]   # every other tool asks for approval
#   - name: remote
#     url: https://mcp.example.com/mcp
#     headers: { Authorization: "Bearer ${REMOTE_MCP_TOKEN}" }

approvals:
  timeout_minutes: 60

